- id: mark-kenny
  author: Mark Kenny
  initials: MK
  source: google
  organization: Walk With Us
  published: '2024-08-30'
  language: en
  screenshot: google/01-mark-kenny.webp
  text: >-
    Arrived in Berlin with no knowledge of the city short of a 28 hour more than twenty years ago!
    This was a perfect introduction to the city; a local guide, loads of good food and tips for what
    to do during our trip. Irem was a lovely host answering all our questions and offering great
    tips for the next few days; if you're new to Berlin, this is the first trip you NEED to do for advice
    on where else to go. And the Hokey Pokey ice-cream is almost worth a trip to Berlin in itself!
