---
layout: default
title: German Presentations
permalink: /categories/german-presentations
---

<h1 class="post-title">German Presentations</h1>

<ul class="item-list">
  {% for post in site.posts %}
  {% if post.categories contains 'german-presentations' %}
  <li>
    <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
    <span class="title"><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></span>
  </li>
  {% endif %}
  {% endfor %}
</ul>
