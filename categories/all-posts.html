---
layout: default
title: All Posts
permalink: /categories/all-posts
---

<h1 class="post-title">All Posts</h1>

<ul class="item-list">
  {% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
    <span class="title"><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></span>
  </li>
  {% endfor %}
</ul>

<p style="text-align:center; margin-top: 2rem;">
  <a href="{{ '/feed.xml' | prepend: site.baseurl }}">Subscribe via RSS</a>
</p>
